<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section>
        <div class="visor"></div>

        <div class="teclado">
            <table>
                <tr>
                    <td colspan="2"><button class="limpar">C</button></td>
                    <td><button class="apagar">←</button></td>
                    <td><button class="operacao">/</button></td>
                </tr>

                <tr>
                    <td><button class="numero">7</button></td>
                    <td><button class="numero">8</button></td>
                    <td><button class="numero">9</button></td>
                    <td><button class="operacao">*</button></td>
                </tr>

                <tr>
                    <td><button class="numero">4</button></td>
                    <td><button class="numero">5</button></td>
                    <td><button class="numero">6</button></td>
                    <td><button class="operacao">-</button></td>
                </tr>

                <tr>
                    <td><button class="numero">1</button></td>
                    <td><button class="numero">2</button></td>
                    <td><button class="numero">3</button></td>
                    <td rowspan="2"><button class="operacao soma">+</button></td>
                </tr>

                <tr>
                    <td><button class="numero">0</button></td>
                    <td><button class="ponto">.</button></td>
                    <td><button class="resultado">=</button></td>
                </tr>
            </table>
        </div>
    </section>
    <script src="script.js"></script>
</body>
</html>
