<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de teste</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section>
        <div class="entrada">
            <h1>Lista de tarefas</h1>
            <form action="">
                <input type="text" class="form-tarefa">
                <input type="submit" value="Adicionar" class="btn-adicionar">
            </form>
        </div>

        <div class="editar">
            <h1>Editar tarefa</h1>
            <form action="">
                <input type="text" class="form-editar">
                <input type="submit" value="OK" class="btn-adicionar btn-ok">
            </form>
        </div>

        <div class="saida">
            <ul class="lista">
                <li class="item modelo display">
                    <span class="titulo-tarefa">Teste 1</span>
                    <button class="btn-concluido">Concluída</button>
                    <button class="btn-editar">Editar</button>
                    <button class="btn-excluir">Excluir</button>
                </li>
            </ul>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
